# Tests the project, then builds the Docker image and publishes it to GitHub's container registry (ghcr.io).
#   push to main        -> ghcr.io/<owner>/<repo>:latest and :sha-<commit>
#   push of a v* tag    -> also :1.2.3, :1.2 (for a tag like v1.2.3)
#   pull request        -> tests and a trial build only; nothing is published
# No secrets to set up: the workflow's own GITHUB_TOKEN may push packages to this repo's registry.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: # lets you run it by hand from the Actions tab

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser test (npm run test:browser) needs Chrome, so it is left for local runs.
      - name: Offline tests (fake Claude and GitHub, no network, no secrets)
        run: |
          npm test
          node test/conduct-offline.mjs
          node test/web-offline.mjs

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to push the image
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3 # lets one runner build for ARM too (Apple Silicon, Raspberry Pi)
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }} # lower-cased automatically
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=reqagent
            org.opencontainers.image.description=Turns requirement files into GitHub issues after your approval (web UI and CLI)

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

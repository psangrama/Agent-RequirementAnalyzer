<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReqAgent: requirements to GitHub issues</title>
<style>
  :root {
    --bg: #f4f5f8; --card: #fff; --text: #1d2330; --muted: #5d6677; --line: #dfe3ea;
    --accent: #2457d6; --accent-text: #fff; --ok: #1a7f37; --warn: #9a6700; --err: #c62828;
    --code: #0f1623; --code-text: #d8e1f0; --nav: #151b2b; --nav-text: #c9d2e4;
    --add: #e6f6ea; --del: #fdecea; --shadow: 0 8px 30px rgba(15, 22, 35, .25);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e121a; --card: #171d29; --text: #e6eaf2; --muted: #98a2b5; --line: #2a3345; --accent: #6b93ff; --accent-text: #0b1020; --ok: #4cc26b; --warn: #e0b341; --err: #ff7b72; --nav: #0a0d14; --add: #12301c; --del: #3a1a1a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  [hidden] { display: none !important; }

  /* top navigation */
  header { background: var(--nav); color: var(--nav-text); display: flex; align-items: center; gap: 20px; padding: 0 16px; flex-wrap: wrap; }
  .brand { font-weight: 700; color: #fff; padding: 12px 0; letter-spacing: .02em; }
  nav { display: flex; gap: 2px; flex: 1; flex-wrap: wrap; }
  nav button { background: none; border: 0; border-bottom: 3px solid transparent; border-radius: 0; color: var(--nav-text); padding: 14px 14px 11px; font-weight: 600; cursor: pointer; font-size: .95rem; }
  nav button:hover { color: #fff; }
  nav button.active { color: #fff; border-bottom-color: var(--accent); }
  .repo { display: flex; align-items: center; gap: 8px; font-size: .85rem; padding: 8px 0; }
  .repo input { width: 200px; padding: 5px 8px; border-radius: 6px; border: 1px solid #38425a; background: #0d1220; color: #fff; font: inherit; }

  /* body: main panel + collapsible command panel */
  .layout { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); gap: 16px; padding: 16px; min-height: 0; transition: grid-template-columns .15s; }
  .layout.tl-collapsed { grid-template-columns: minmax(0, 1fr) 46px; }
  @media (max-width: 900px) { .layout, .layout.tl-collapsed { grid-template-columns: 1fr; } .timeline { max-height: 60vh; } .timeline.collapsed { max-height: none; } }
  .main, .timeline { background: var(--card); border: 1px solid var(--line); border-radius: 10px; min-height: 0; overflow: auto; }
  .main { padding: 20px; position: relative; }
  .timeline { display: flex; flex-direction: column; }
  .timeline > h2 { margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .timeline > h2 button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; cursor: pointer; font: inherit; padding: 0 8px; }
  .timeline.collapsed > h2 { flex-direction: column; border-bottom: 0; padding: 10px 6px; height: 100%; justify-content: flex-start; }
  .timeline.collapsed .ttl { writing-mode: vertical-rl; margin-top: 8px; }
  .timeline.collapsed #tl { display: none; }
  #tl { overflow: auto; padding: 8px 12px 16px; flex: 1; }
  .empty { color: var(--muted); padding: 24px 8px; text-align: center; font-size: .9rem; }

  h1 { font-size: 1.25rem; margin: 0 0 4px; } h2.sec { font-size: 1rem; margin: 22px 0 8px; }
  .sub, .hint { color: var(--muted); font-size: .88rem; margin: 2px 0 12px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; font-size: .85rem; }
  label.inline { font-weight: 400; display: flex; gap: 6px; align-items: center; margin: 8px 0; }
  input[type=text], select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  textarea { resize: vertical; min-height: 70px; }
  button.btn { font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); cursor: pointer; }
  button.btn.secondary { background: transparent; color: var(--accent); }
  button.btn.danger { background: var(--err); border-color: var(--err); color: #fff; }
  button.btn.small { padding: 2px 9px; font-size: .78rem; }
  button.btn:disabled { opacity: .45; cursor: not-allowed; }
  button.link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 0; text-decoration: underline; }
  .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 30px; text-align: center; color: var(--muted); cursor: pointer; }
  .drop.over, .drop:focus-visible { border-color: var(--accent); color: var(--text); outline: none; }
  .drop strong { color: var(--text); }
  .banner { padding: 9px 12px; border-radius: 6px; border: 1px solid var(--warn); color: var(--warn); margin: 0 0 14px; font-size: .88rem; }
  .err { color: var(--err); } .okc { color: var(--ok); }
  .mono { font-family: ui-monospace, Consolas, monospace; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .78rem; white-space: nowrap; }
  td.state { text-align: center; color: var(--muted); padding: 22px 8px; }
  tr.next td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .badge { font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; display: inline-block; }
  .badge.running, .badge.drafted, .badge.approved, .badge.modified { color: var(--accent); }
  .badge.done, .badge.pushed, .badge.completed { color: var(--ok); }
  .badge.failed, .badge.blocked, .badge.dropped { color: var(--err); }
  .badge.stopped, .badge.pending, .badge.idle { color: var(--muted); } .badge.in-flight, .badge.unsaved { color: var(--warn); }
  .lab { font: .7rem ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-right: 4px; white-space: nowrap; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin, .prog.indet i { animation: none !important; } }

  /* runs: collapsible list + full-width detail */
  .runs { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; align-items: start; }
  .runs.list-collapsed { grid-template-columns: 38px minmax(0, 1fr); }
  @media (max-width: 800px) { .runs, .runs.list-collapsed { grid-template-columns: 1fr; } }
  .runlist { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); position: sticky; top: 0; max-height: calc(100vh - 150px); overflow: auto; }
  .runlist .head { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; font-weight: 700; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .runlist .head button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; cursor: pointer; }
  .runs.list-collapsed .runlist .items { display: none; }
  .runs.list-collapsed .runlist .head { flex-direction: column; gap: 8px; padding: 8px 4px; }
  .runs.list-collapsed .runlist .head span { writing-mode: vertical-rl; }
  .repo label { white-space: nowrap; }
  details.clar > summary { cursor: pointer; list-style: none; font-weight: 700; font-size: .95rem; }
  details.clar > summary::-webkit-details-marker { display: none; }
  details.clar > summary::before { content: '▸ '; } details.clar[open] > summary::before { content: '▾ '; }
  .runitem { padding: 8px 10px; border-top: 1px solid var(--line); cursor: pointer; }
  .runitem:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .runitem.sel { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .runitem .t { font-weight: 600; font-size: .88rem; word-break: break-word; }
  .runitem .m { font-size: .74rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
  .runhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .runhead h2 { margin: 0; font-size: 1.15rem; }
  .runhead input { max-width: 380px; }
  .runmeta { color: var(--muted); font-size: .8rem; margin: 2px 0 0; }
  .stepper { display: flex; gap: 6px; margin: 12px 0 4px; flex-wrap: wrap; }
  .stepper span { font-size: .8rem; padding: 3px 11px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .stepper span.on { border-color: var(--accent); color: var(--text); font-weight: 600; }
  .stepper span.ok { color: var(--ok); border-color: var(--ok); }

  /* clarifications */
  .clar { border: 1px solid var(--warn); border-left-width: 4px; border-radius: 8px; padding: 12px 14px; margin: 14px 0; }
  .clar h3 { margin: 0 0 2px; font-size: .95rem; }
  .q { padding: 10px 0; border-top: 1px solid var(--line); }
  .q:first-of-type { border-top: 0; }
  .q .ref { font: .72rem ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-right: 6px; }
  .q .ask { font-weight: 600; margin: 4px 0 6px; font-size: .88rem; }
  .q .why { color: var(--muted); font-size: .82rem; }
  .q .ans { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .q .ans input { flex: 1; min-width: 180px; }
  .q.answered { opacity: .95; }
  .q.answered .ref { border-color: var(--ok); color: var(--ok); }

  /* issue table */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; font-size: .85rem; }
  .toolbar select { width: auto; padding: 3px 6px; }
  .mix { display: flex; height: 8px; border-radius: 99px; overflow: hidden; width: 160px; border: 1px solid var(--line); }
  .mix i { display: block; } .mix .h { background: var(--err); } .mix .m { background: var(--warn); } .mix .l { background: var(--ok); }
  .bulk { background: color-mix(in srgb, var(--accent) 9%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  table.issues { table-layout: fixed; }
  table.issues th.c-cb { width: 30px; } table.issues th.c-n { width: 34px; } table.issues th.c-id { width: 74px; }
  table.issues th.c-pri { width: 98px; } table.issues th.c-est { width: 70px; } table.issues th.c-gh { width: 96px; } table.issues th.c-act { width: 64px; }
  table.issues td { vertical-align: middle; }
  table.issues td select { width: 100%; padding: 2px 4px; font-size: .82rem; }
  table.issues .n, table.issues .id { font: .76rem ui-monospace, Consolas, monospace; color: var(--muted); }
  table.issues tr.epic td { font-weight: 600; background: color-mix(in srgb, var(--accent) 5%, transparent); }
  table.issues tr.story .tt { padding-left: 18px; } table.issues tr.task .tt { padding-left: 40px; color: var(--muted); font-size: .85rem; }
  table.issues tr.dim { opacity: .55; }
  table.issues .tt { overflow-wrap: anywhere; }
  .tog { background: none; border: 0; cursor: pointer; color: var(--muted); padding: 0 4px 0 0; font-size: .8rem; }
  .hl-high { color: var(--err); } .hl-medium { color: var(--warn); } .hl-low { color: var(--ok); }

  /* sticky action footer */
  .foot { position: sticky; bottom: -20px; margin: 22px -20px -20px; padding: 10px 20px; background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -6px 14px rgba(15, 22, 35, .08); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 5; }
  .foot .grow { flex: 1; min-width: 160px; font-size: .86rem; color: var(--muted); }
  .foot .grow b { color: var(--text); }
  .foot .pending { flex-basis: 100%; display: flex; gap: 8px; align-items: center; font-size: .85rem; color: var(--warn); }

  /* modal + drawer */
  .overlay { position: fixed; inset: 0; background: rgba(8, 12, 20, .55); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--card); border: 1px solid var(--line); border-radius: 12px; width: min(640px, 100%); max-height: 90vh; overflow: auto; box-shadow: var(--shadow); padding: 20px; }
  .modal h2 { margin: 0 0 6px; font-size: 1.1rem; }
  .overlay.drawer-wrap { justify-content: flex-end; align-items: stretch; padding: 0; }
  .drawer { background: var(--card); border-left: 1px solid var(--line); width: min(600px, 100%); height: 100%; overflow: auto; box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .drawer .dh { padding: 14px 18px 0; } .drawer .db { padding: 6px 18px 18px; flex: 1; overflow: auto; }
  .drawer .df { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 18px; display: flex; gap: 8px; align-items: center; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: 8px; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 12px; cursor: pointer; font: inherit; color: var(--muted); font-weight: 600; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .diff { border: 1px solid var(--line); border-radius: 6px; margin: 6px 0 12px; font: .8rem/1.45 ui-monospace, Consolas, monospace; overflow: hidden; }
  .diff div { padding: 1px 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .diff .add { background: var(--add); } .diff .del { background: var(--del); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--err) 50%, transparent); }
  .steps { list-style: none; padding: 0; margin: 12px 0; }
  .steps li { padding: 6px 0; display: flex; gap: 8px; align-items: center; }
  .steps .dot { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-size: .72rem; color: var(--muted); }
  .steps li.done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
  .steps li.now .dot { border-color: var(--accent); color: var(--accent); }
  dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 10px 0; font-size: .9rem; }
  dl.facts dt { color: var(--muted); } dl.facts dd { margin: 0; font-weight: 600; word-break: break-all; }

  /* model picker */
  .models { display: grid; gap: 8px; margin: 6px 0; }
  .mcard { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 8px; align-items: start; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; cursor: pointer; margin: 0; font-weight: 400; background: var(--bg); }
  .mcard:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
  .mcard .nm { font-weight: 700; } .mcard .why { color: var(--muted); font-size: .8rem; grid-column: 2; }
  .mcard .est { text-align: right; font-size: .8rem; white-space: nowrap; } .mcard .est small { display: block; color: var(--muted); }
  .tag { font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--accent-text); background: var(--accent); border-radius: 4px; padding: 1px 6px; margin-left: 6px; }

  /* command timeline */
  .step { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; background: var(--bg); }
  .step.running { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
  .step summary { list-style: none; cursor: pointer; padding: 8px 10px; display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: start; }
  .step summary::-webkit-details-marker { display: none; }
  .step .seq { font: .75rem ui-monospace, Consolas, monospace; color: var(--muted); padding-top: 2px; }
  .step .cmd { font: .8rem/1.35 ui-monospace, Consolas, monospace; word-break: break-all; }
  .step .when { grid-column: 2 / 4; font-size: .74rem; color: var(--muted); }
  .step .prog { margin: 0 10px 8px; }
  .prog { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; position: relative; }
  .prog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .prog.indet i { width: 35%; position: absolute; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { left: -35%; } 100% { left: 100%; } }
  .step .now { margin: 0 10px 8px; font-size: .78rem; color: var(--muted); overflow-wrap: anywhere; }
  .step pre { margin: 0; padding: 10px; background: var(--code); color: var(--code-text); font: .75rem/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; max-height: 260px; overflow: auto; }
  .step .next { padding: 8px 10px; display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--line); }
  .results a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="brand">ReqAgent</div>
  <nav id="nav">
    <button data-view="new" class="active">New run</button>
    <button data-view="runs">Runs</button>
    <button data-view="conductor">Conductor</button>
    <button data-view="history">History</button>
  </nav>
  <div class="repo"><label for="repo" style="margin:0;font-weight:400">GitHub repo</label><input type="text" id="repo" placeholder="owner/name"></div>
</header>

<div class="layout" id="layout">
  <main class="main" id="main"></main>
  <aside class="timeline" id="timeline" aria-live="polite">
    <h2><span class="ttl">Commands</span><span id="tlState" class="badge idle">idle</span><button id="tlToggle" title="Hide or show the command panel" aria-label="Hide or show the command panel">⇥</button></h2>
    <div id="tl"><div class="empty">Nothing has run yet. Each command you start appears here, in order, with its output.</div></div>
  </aside>
</div>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
/** h('div', {class:'x', on:{click:fn}}, child, ...) */
const h = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'on') Object.entries(v).forEach(([ev, fn]) => e.addEventListener(ev, fn));
    else if (k in e) e[k] = v;
    else e.setAttribute(k, v);
  }
  e.append(...kids.flat().filter((x) => x != null && x !== false));
  return e;
};
const badge = (status, text) => el('span', text || status, 'badge ' + status);
const repoRe = /^[\w.-]+\/[\w.-]+$/;
const store = { get: (k) => { try { return localStorage.getItem(k) || ''; } catch { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'x-reqagent-ui': '1', ...(opts.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const post = (path, body) => api(path, { method: 'POST', body: JSON.stringify(body || {}) });
const repo = () => $('repo').value.trim();
const msg = (box, text, cls = 'err') => box.replaceChildren(el('div', text, 'hint ' + cls));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function waitJob(id) { for (;;) { const j = await api('/api/jobs/' + id); if (j.status !== 'running') return j; await sleep(600); } }

let view = 'new', file = null, run = null, detail = null, config = {};

// ---------------- table states (loading / empty / error) ----------------
const stateRow = (cols, content) => h('tr', {}, h('td', { colSpan: cols, class: 'state' }, content));
const loadingRow = (cols, text = 'Loading…') => stateRow(cols, [h('span', { class: 'spin' }), text]);
const emptyRow = (cols, text) => stateRow(cols, text);
const errorRow = (cols, text) => stateRow(cols, h('span', { class: 'err' }, text));

// ---------------- dialogs ----------------
let closeTop = null;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && closeTop) closeTop(); });
/** Opens a centred dialog (or a side drawer). `build(ctx)` fills it; returns { close, el }. */
function openDialog({ title, drawer = false, build, onClose }) {
  const prevFocus = document.activeElement;
  const body = h('div');
  const root = drawer
    ? h('div', { class: 'overlay drawer-wrap' }, h('div', { class: 'drawer', role: 'dialog', 'aria-modal': 'true', 'aria-label': title }, body))
    : h('div', { class: 'overlay' }, h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title }, body));
  const ctx = { body, close: null, root };
  const previousTop = closeTop;
  ctx.close = (force) => {
    if (!force && onClose && onClose() === false) return;
    root.remove(); closeTop = previousTop; prevFocus?.focus?.();
  };
  closeTop = () => ctx.close(false);
  root.addEventListener('mousedown', (e) => { if (e.target === root) ctx.close(false); });
  build(ctx);
  document.body.append(root);
  (root.querySelector('[autofocus]') || root.querySelector('button, input, textarea, select'))?.focus();
  return ctx;
}
/** Promise-based confirmation. `lines` are strings or nodes shown above the buttons. */
function confirmDialog({ title, lines = [], confirmText = 'Confirm', danger = false, ack = null }) {
  return new Promise((resolve) => {
    openDialog({
      title,
      onClose: () => { resolve(false); },
      build: (d) => {

  while (i < n && j < m) { if (a[i] === b[j]) { out.push(['same', a[i]]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) out.push(['del', a[i++]]); else out.push(['add', b[j++]]); }
  while (i < n) out.push(['del', a[i++]]); while (j < m) out.push(['add', b[j++]]);

}

/** Hides file paths and the CLI's own "Next: reqagent ..." hints; the panel shows clickable next steps instead. */

    skip = false;
    if (/^\s*(Saved to|Full preview:)/i.test(line)) continue;
    line = line.replace(/[A-Za-z]:\\(?:[^\s\\"'<>|]+\\)*([^\s\\"'<>|]*)/g, '…/$1').replace(/(?<![\w:.\/-])\/(?:[\w.-]+\/)+([\w.-]+)/g, '…/$1');
    out.push(line);
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}
const jobRun = (j) => j.run || /--run (\S+)/.exec(j.command)?.[1] || null;
function nextSteps(j) {
  const r = jobRun(j), steps = [];
  const open = async (name, after) => { run = name; detail = null; if (view !== 'runs') await show('runs'); else await openRun(name); after?.(); };
  if (j.status === 'done') {
    if (j.label === 'analyze' && r) steps.push(['Review the drafts →', () => open(r)]);
    if (['approve', 'dry run'].includes(j.label) && r) steps.push(['Create on GitHub →', () => open(r, () => detail && createWizard(detail, selections[r] || new Set(detail.items.map((i) => i.id))))]);
    if (['regenerate', 'edit'].includes(j.label) && r) steps.push(['Review the changes →', () => open(r)]);
    if (j.label === 'push' && r) steps.push(['Conduct with Quorum →', () => { conductorRun = r; show('conductor'); }]);
    if (j.label.startsWith('conductor')) steps.push(['View the Conductor →', () => show('conductor')]);
  } else if (j.status === 'failed' && r) steps.push(['Open this run', () => open(r)]);
  return steps;
}
function progressOf(j, clean) {
  const nums = [...j.log.matchAll(/\[(\d+)\/(\d+)\]/g)].pop();
  const last = clean.split('\n').filter(Boolean).pop();
  return { pct: nums ? (Number(nums[1]) / Number(nums[2])) * 100 : null, label: nums ? `${nums[1]} of ${nums[2]} done` : '', last };
}

async function poll(fast) {
  clearTimeout(timer);
  let a;
  try { a = await api('/api/activity'); } catch { timer = setTimeout(poll, 4000); return; }
  const tl = $('tl');
  if (a.jobs.length) tl.querySelector('.empty')?.remove();
  const finished = a.jobs.filter((j) => j.status !== 'running').at(-1);
  for (const j of a.jobs) {
    let s = stepEls.get(j.id);
    if (!s) {
      const d = el('details', null, 'step'); const sum = el('summary'); const pre = el('pre'); const prog = el('div', null, 'prog'); prog.append(el('i')); const now = el('div', null, 'now'); const nx = el('div', null, 'next');
      sum.append(el('span', '', 'seq'), el('span', '', 'cmd'), el('span'), el('span', '', 'when')); d.append(sum, prog, now, pre, nx);
      d.open = j.status === 'running'; tl.append(d); s = { d, sum, pre, prog, now, nx }; stepEls.set(j.id, s);
    }
    s.d.className = 'step ' + j.status;
    s.sum.children[0].textContent = String(j.seq);
    s.sum.children[1].textContent = j.command;
    s.sum.children[2].replaceChildren(badge(j.status));
    s.sum.children[3].textContent = `${j.label} · ${fmt(j.startedAt)} · ${dur(j.startedAt, j.endedAt)}${j.status === 'failed' ? ` · exit ${j.code}` : ''}`;
    const clean = cleanLog(j.log), p = progressOf(j, clean), running = j.status === 'running';
    s.prog.hidden = s.now.hidden = !running;
    if (running) {
      s.prog.classList.toggle('indet', p.pct == null);
      s.prog.firstChild.style.width = p.pct == null ? '' : p.pct + '%';
      s.now.replaceChildren(h('span', { class: 'spin' }), p.label || p.last || 'Starting…', p.label && p.last ? ` · ${p.last}` : '');
    }
    s.pre.hidden = !clean && running;
    const atBottom = s.pre.scrollTop + s.pre.clientHeight >= s.pre.scrollHeight - 8;
    s.pre.textContent = clean || (running ? '' : '(no output)');
    if (atBottom) s.pre.scrollTop = s.pre.scrollHeight;
    if (running && !s.seenRunning) { s.seenRunning = true; tl.scrollTop = tl.scrollHeight; }
    // clickable next steps only on the most recent finished command
    s.nx.replaceChildren();
    if (finished && j.id === finished.id) nextSteps(j).forEach(([t, fn]) => s.nx.append(h('button', { class: 'btn small', on: { click: fn } }, t)));
    s.nx.hidden = !s.nx.firstChild;
    if (j.status !== 'running' && !handled.has(j.id)) { handled.add(j.id); if (!firstPoll) afterJob(j); }
  }
  const running = a.jobs.some((j) => j.status === 'running'), loop = a.loop?.status === 'running';
  const st = $('tlState'); st.className = 'badge ' + (running ? 'running' : loop ? 'running' : 'idle'); st.textContent = running ? 'running' : loop ? 'auto-dispatch on' : 'idle';
  $('timeline').title = running ? 'A command is running' : '';
  if (loop !== loopOn) { loopOn = loop; if (view === 'conductor') viewConductor(); }
  if (loop && view === 'conductor') conductorRefresh();
  firstPoll = false;
  timer = setTimeout(poll, running || loop || fast ? 1000 : 4000);
}

/** What to show when a command finishes. */
function afterJob(j) {
  if (j.status === 'done' && j.label === 'analyze' && j.run) { run = j.run; detail = null; show('runs'); return; }
  if (['approve', 'dry run', 'push', 'regenerate', 'edit'].includes(j.label) && view === 'runs' && run) openRun(run, true);
  if (j.label.startsWith('conductor') && view === 'conductor') conductorRefresh();
}

// command panel collapse
function setTl(collapsed) {
  $('layout').classList.toggle('tl-collapsed', collapsed); $('timeline').classList.toggle('collapsed', collapsed);
  $('tlToggle').textContent = collapsed ? '⇤' : '⇥'; store.set('tlCollapsed', collapsed ? '1' : '');
}
$('tlToggle').onclick = () => setTl(!$('timeline').classList.contains('collapsed'));
$('timeline').addEventListener('click', (e) => { if ($('timeline').classList.contains('collapsed') && e.target !== $('tlToggle')) setTl(false); });

// ---------------- boot ----------------
(async () => {
  $('repo').value = store.get('repo');
  setTl(store.get('tlCollapsed') === '1');
  try { config = await api('/api/config'); if (!$('repo').value) $('repo').value = config.repo || ''; } catch {}
  const [v, name] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (['new', 'runs', 'conductor', 'history'].includes(v)) { if (name) run = name; show(v); } else show('new');
  poll();
})();
</script>
</body>
